<form class="date-filter" method="get" data-date-filter>
  {% if source_key == 'zoho' %}<input type="hidden" name="department" value="{{ department_key }}">{% endif %}
  {% if source_key == 'bik' %}<input type="hidden" name="report" value="{{ bik_report }}">{% endif %}
  <label>
    <span>Period</span>
    <select name="preset" data-preset>
      {% for value, label in date_presets %}<option value="{{ value }}" {{ 'selected' if preset == value }}>{{ label }}</option>{% endfor %}
    </select>
  </label>
  <div class="custom-dates {{ 'visible' if preset == 'custom' }}" data-custom-dates>
    <label><span>From</span><input type="date" name="start" value="{{ start.isoformat() }}"></label>
    <label><span>To</span><input type="date" name="end" value="{{ end.isoformat() }}"></label>
  </div>
  <button class="filter-button" type="submit">Apply</button>
</form>
